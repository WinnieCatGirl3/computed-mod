name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          mod_version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)
          default_tag="v${mod_version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" != "${default_tag}" ]]; then
              echo "::error::Tag ${tag} does not match gradle.properties mod_version=${mod_version} (expected ${default_tag})"
              exit 1
            fi
          else
            tag="${default_tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "mod_version=${mod_version}" >> "${GITHUB_OUTPUT}"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare release jar
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(ls build/libs/*.jar | grep -Ev '(-sources|-javadoc)' | head -n 1 || true)"
          if [[ -z "${artifact}" ]]; then
            echo "No jar artifact found in build/libs"
            exit 1
          fi
          release_name="computed-${{ steps.target.outputs.tag }}.jar"
          release_path="build/libs/${release_name}"
          cp "${artifact}" "${release_path}"
          echo "path=${release_path}" >> "${GITHUB_OUTPUT}"

      # The release for the current mod_version always mirrors main: create it on the
      # first build, replace the jar (and move the tag) on every later push so an
      # already-published version can be corrected without a version bump.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          MOD_VERSION: ${{ steps.target.outputs.mod_version }}
          JAR_PATH: ${{ steps.artifact.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists — replacing jar and moving tag to ${GITHUB_SHA}."
            gh release upload "${TAG}" "${JAR_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            git tag -f "${TAG}" "${GITHUB_SHA}"
            git push -f origin "refs/tags/${TAG}"
          else
            prerelease_args=()
            if [[ "${MOD_VERSION}" == *-alpha* || "${MOD_VERSION}" == *-beta* || "${MOD_VERSION}" == *-rc* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "${TAG}" "${JAR_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Winnie's Computed ${TAG}" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
