name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          mod_version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)
          default_tag="v${mod_version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" != "${default_tag}" ]]; then
              echo "::error::Tag ${tag} does not match gradle.properties mod_version=${mod_version} (expected ${default_tag})"
              exit 1
            fi
          else
            tag="${default_tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "mod_version=${mod_version}" >> "${GITHUB_OUTPUT}"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare release jar
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(ls build/libs/*.jar | grep -Ev '(-sources|-javadoc)' | head -n 1 || true)"
          if [[ -z "${artifact}" ]]; then
            echo "No jar artifact found in build/libs"
            exit 1
          fi
          release_name="computed-${{ steps.target.outputs.tag }}.jar"
          release_path="build/libs/${release_name}"
          cp "${artifact}" "${release_path}"
          echo "path=${release_path}" >> "${GITHUB_OUTPUT}"

      # The release for the current mod_version always mirrors main: create it on the
      # first build, replace the jar (and move the tag) on every later push so an
      # already-published version can be corrected without a version bump.
      # Failures are reported as ::error annotations because run logs need auth.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          MOD_VERSION: ${{ steps.target.outputs.mod_version }}
          JAR_PATH: ${{ steps.artifact.outputs.path }}
        shell: bash
        run: |
          set -uo pipefail

          note() { echo "::notice title=Publish::${1}"; }
          die() { echo "::error title=Publish failed::${1}"; exit 1; }

          run_step() {
            local desc="$1"; shift
            local out rc=0
            out=$("$@" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ]; then
              die "${desc} (exit ${rc}): $(printf '%s' "$out" | tail -c 3500)"
            fi
            printf '%s\n' "$out"
            return 0
          }

          command -v gh > /dev/null || die "gh CLI is not on PATH"
          note "tag=${TAG} sha=${GITHUB_SHA}"
          ls -la "${JAR_PATH}" > /dev/null 2>&1 || die "jar missing at ${JAR_PATH}"
          note "jar ok: $(ls -la "${JAR_PATH}")"

          view_rc=0
          view_out=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" 2>&1) || view_rc=$?
          note "gh release view rc=${view_rc}: $(printf '%s' "${view_out}" | head -c 400)"

          if [ "${view_rc}" -eq 0 ]; then
            run_step "gh release upload" gh release upload "${TAG}" "${JAR_PATH}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
            note "asset replaced"
            run_step "git tag -f" git tag -f "${TAG}" "${GITHUB_SHA}"
            run_step "git push tag" git push -f origin "refs/tags/${TAG}"
            note "tag moved to ${GITHUB_SHA}"
          else
            prerelease_args=()
            if [[ "${MOD_VERSION}" == *-alpha* || "${MOD_VERSION}" == *-beta* || "${MOD_VERSION}" == *-rc* ]]; then
              prerelease_args+=(--prerelease)
            fi
            run_step "gh release create" gh release create "${TAG}" "${JAR_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Winnie's Computed ${TAG}" \
              --generate-notes \
              "${prerelease_args[@]}"
            note "release created"
          fi
